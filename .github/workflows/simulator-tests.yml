name: Simulator tests
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-backend-lock.txt
      - run: python -m unittest discover -v
      - run: python -m mission_control.smoke --report /tmp/stage9-loopback.json
      - run: python -m mission_control.release_check --report /tmp/stage11-transport.json

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m pip install -r requirements-backend-lock.txt
      - run: npm ci
        working-directory: dashboard
      - run: npm run format:check && npm run build && npm run typecheck && npm test
        working-directory: dashboard
      - run: python -m scripts.check_startup --report /tmp/stage11-startup.json
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e
        working-directory: dashboard
        env:
          BACKEND_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/

  sitl-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sitl.txt
      - run: python -m unittest tests.test_real_sitl -v
